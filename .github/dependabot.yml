version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tipos:
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
    ignore:
      # El motor del proyecto es Node 24; los tipos de otra versión mayor de Node no corresponden.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
