name: Verificación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=low
      - name: Prueba de humo con la compilación de producción
        run: |
          npm start > servidor.log 2>&1 &
          servidor=$!
          for intento in $(seq 1 30); do
            curl --silent --fail http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          npm run smoke
          kill "$servidor"
      - name: Registro del servidor
        if: failure()
        run: cat servidor.log
