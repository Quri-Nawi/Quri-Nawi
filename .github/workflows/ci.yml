name: Verificación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

concurrency:
  group: verificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=low
      - name: Prueba de humo con la compilación de producción
        run: |
          npm start > servidor.log 2>&1 &
          servidor=$!
          for intento in $(seq 1 30); do
            curl --silent --fail http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          npm run smoke
          kill "$servidor"
      - name: Registro del servidor
        if: failure()
        run: cat servidor.log
